name: native-windows-hermes-owner-contract

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: native-windows-hermes-owner-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-windows-owner-contract:
    runs-on: windows-2025
    steps:
      - name: Check out exact consumer revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install exact Windows process dependency
        run: python -m pip install --requirement integrations/hermes-owner-receipt/requirements-ci.txt

      - name: Replay producer-to-consumer owner contract
        run: |
          python -B integrations/hermes-owner-receipt/test_native_windows_contract.py
          python -B integrations/hermes-owner-receipt/run_native_windows_contract.py --output windows-owner-contract-receipt.json

      - name: Upload metadata-only contract receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-owner-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: windows-owner-contract-receipt.json
          if-no-files-found: error
          retention-days: 1

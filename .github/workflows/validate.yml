name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned contract consumer dependency
        run: python -m pip install --no-deps -r requirements-contracts.txt
      - name: Validate repo
        run: bash scripts/validate.sh

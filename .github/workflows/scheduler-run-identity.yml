name: scheduler-run-identity

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: scheduler-run-identity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  attest-run-identity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build strict metadata-only run identity
        run: python3 -B scripts/build_scheduler_run_identity.py --output scheduler-run-identity.json
        env:
          PROVIDER_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Generate GitHub OIDC/Sigstore provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: scheduler-run-identity.json

      - name: Upload identity for downstream verification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scheduler-run-identity-${{ github.run_id }}-${{ github.run_attempt }}
          path: scheduler-run-identity.json
          if-no-files-found: error
          retention-days: 1
